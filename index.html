<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گروه تخصصی صدابرداری ذاکر | Zaker Sound Group</title>
<meta name="theme-color" content="#08090c">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (easy to change) ===== */
:root{--bg:#08090c;--bg2:#111318;--card:#16181f;--line:#2a2d38;--text:#eef0f5;--mute:#a3a8b8;--gold:#f39a1c;--teal:#ffb84d;
--font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.9;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 18px}
section{padding:70px 0}
h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:0 0 8px;font-weight:800}
h2 span{color:var(--gold)}
.sub{color:var(--mute);margin:0 0 34px;max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:50px;border:0;cursor:pointer;font:600 1rem var(--font);transition:.25s}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffc766);color:#1a1202}
.btn.gold:hover{transform:translateY(-3px);box-shadow:0 10px 26px #f39a1c44}
.btn.line{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.btn.line:hover{background:var(--teal);color:#1a1202}
/* ===== Header ===== */
header{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:#08090cd9;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.logo img{height:46px;width:auto;display:block}.hl{width:clamp(250px,72vw,310px);height:auto;margin:0 auto 10px;display:block}.about .box img{width:82%;height:auto}@media(min-width:861px){.logo img{height:54px}.hl{width:430px}}.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--teal));display:grid;place-items:center;color:#051018;font-style:normal;font-weight:800;font-size:1.3rem}
.logo small{display:block;font-size:.62rem;color:var(--mute);font-weight:400;line-height:1.2}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0;font-size:.92rem}
nav a{color:var(--mute);transition:.2s}nav a:hover{color:var(--gold)}
.tools{display:flex;gap:8px;align-items:center}
#lang{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 14px;cursor:pointer;font:600 .85rem var(--font)}
#burger{display:none;background:none;border:0;color:var(--text);font-size:1.6rem;cursor:pointer}
@media(max-width:860px){#burger{display:block}
nav{position:fixed;inset:calc(68px + env(safe-area-inset-top,0px)) 0 auto 0;background:var(--bg2);max-height:0;overflow:hidden;transition:.35s}
nav.open{max-height:480px;border-bottom:1px solid var(--line)}
nav ul{flex-direction:column;padding:14px 20px;gap:12px}}
/* ===== Hero ===== */
.hero{min-height:100vh;display:flex;align-items:center;text-align:center;padding-top:90px;position:relative;background:radial-gradient(ellipse at 50% 20%,#3a2408 0,transparent 60%),var(--bg)}
.hero h1{font-size:clamp(2rem,7vw,4rem);line-height:1.35;margin:10px 0;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--teal);letter-spacing:.5px;font-weight:600}
.hero p{color:var(--mute);max-width:620px;margin:0 auto 28px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.eq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:90px;margin:44px 0 0;direction:ltr}
.eq b{width:7px;border-radius:5px;background:linear-gradient(var(--teal),var(--gold));height:20%;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{to{height:100%}}
/* ===== Cards ===== */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:24px;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card .ic{font-size:1.9rem}.card h3{margin:8px 0 4px;font-size:1.1rem}.card p{margin:0;color:var(--mute);font-size:.93rem}
.alt{background:var(--bg2)}
.brand{text-align:center}.brand h3{font-size:1.4rem;color:var(--gold);letter-spacing:1px;direction:ltr}
/* ===== About ===== */
.about{display:grid;gap:30px;grid-template-columns:1fr;align-items:center}
@media(min-width:800px){.about{grid-template-columns:1.2fr 1fr}}
.about .box{aspect-ratio:4/3;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 30% 30%,#f39a1c33,transparent 55%),linear-gradient(135deg,var(--card),var(--bg2));display:grid;place-items:center;font-size:5rem}
/* ===== Gallery ===== */
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.gal button{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;cursor:pointer;color:#fff;font:600 .9rem var(--font);display:grid;place-items:end start;padding:12px;transition:.3s}
.gal button:hover{transform:scale(1.04)}
#lb{position:fixed;inset:0;background:#000d;z-index:90;display:none;place-items:center;padding:20px}
#lb.on{display:grid}#lb div{width:min(92vw,720px);aspect-ratio:4/3;border-radius:20px;display:grid;place-items:end start;padding:24px;font-size:1.3rem;font-weight:700}
/* ===== Stats ===== */
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));text-align:center}
.stats b{display:block;font-size:2.6rem;color:var(--gold);direction:ltr}.stats span{color:var(--mute)}
/* ===== Slider ===== */
.slider{overflow:hidden;border-radius:18px}
.track{display:flex;transition:transform .6s}
.slide{min-width:100%;padding:30px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:center}
.slide p{font-size:1.05rem;margin:0 0 12px}.slide small{color:var(--gold)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots .on{background:var(--gold)}
/* ===== FAQ ===== */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:14px 18px}
summary{cursor:pointer;font-weight:600}details[open]{border-color:var(--gold)}details p{color:var(--mute);margin:8px 0 0}
/* ===== Contact ===== */
.contact{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:800px){.contact{grid-template-columns:1.3fr 1fr}}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:1rem var(--font)}
input:focus,textarea:focus{outline:2px solid var(--teal)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:520px){.two{grid-template-columns:1fr}}
.cl{display:flex;flex-direction:column;gap:12px}.cl a{justify-content:flex-start}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--mute);font-size:.9rem}
footer .links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.rv{opacity:0;transform:translateY(30px);transition:.8s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header><div class="wrap nav">
  <a href="#home" class="logo"><img class="lg" alt="ذاکر"><span><span data-t="brand"></span><small>Zaker Sound Group</small></span></a>
  <nav id="menu"><ul id="navl"></ul></nav>
  <div class="tools"><button id="lang" aria-label="Language">EN</button><button id="burger" aria-label="Menu">☰</button></div>
</div></header>

<main>
<section class="hero" id="home"><div class="wrap">
  <img class="lg hl" alt="ذاکر"><div class="tag" data-t="slogan"></div>
  <h1><span data-t="h1a"></span><br><span data-t="h1b" style="-webkit-text-fill-color:var(--text);color:var(--text)"></span></h1>
  <p data-t="heroP"></p>
  <div class="cta"><a class="btn gold" href="#contact" data-t="cta1"></a><a class="btn line" href="#services" data-t="cta2"></a></div>
  <div class="eq" id="eq" aria-hidden="true"></div>
</div></section>

<section id="about"><div class="wrap about rv">
  <div><h2 data-t="aboutH"></h2><p class="sub" data-t="aboutP1"></p><p class="sub" data-t="aboutP2"></p></div>
  <div class="box"><img class="lg" alt="ذاکر"></div>
</div></section>

<section class="alt" id="services"><div class="wrap rv"><h2 data-t="servH"></h2><p class="sub" data-t="servP"></p><div class="grid" id="servG"></div></div></section>

<section id="gear"><div class="wrap rv"><h2 data-t="gearH"></h2><p class="sub" data-t="gearP"></p><div class="grid" id="gearG"></div></div></section>

<section class="alt" id="gallery"><div class="wrap rv"><h2 data-t="galH"></h2><p class="sub" data-t="galP"></p><div class="gal" id="galG"></div></div></section>

<section id="stats"><div class="wrap stats rv" id="statG"></div></section>

<section class="alt" id="reviews"><div class="wrap rv"><h2 data-t="revH"></h2><div class="slider"><div class="track" id="track"></div></div><div class="dots" id="dots"></div></div></section>

<section id="faq"><div class="wrap rv"><h2 data-t="faqH"></h2><div id="faqG"></div></div></section>

<section class="alt" id="contact"><div class="wrap contact rv">
  <div>
    <h2 data-t="conH"></h2><p class="sub" data-t="conP"></p>
    <form id="f" onsubmit="return false">
      <div class="two"><input id="n" data-tp="fName" required><input id="h" data-tp="fHeyat"></div>
      <div class="two"><input id="d" data-tp="fDate"><input id="p" data-tp="fPhone" type="tel" inputmode="tel"></div>
      <textarea id="m" rows="4" data-tp="fMsg"></textarea>
      <div class="cta" style="justify-content:flex-start">
        <button class="btn gold" id="sendWa" data-t="sendWa"></button>
        <button class="btn line" id="sendEi" data-t="sendEi"></button>
      </div>
      <small id="note" style="color:var(--teal)"></small>
    </form>
  </div>
  <div class="cl">
    <a class="btn line" id="lCall" data-t="call"></a>
    <a class="btn line" id="lWa" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn line" id="lEi" target="_blank" rel="noopener">Eitaa / ایتا</a>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <div class="links"><a href="#about" data-t="nAbout"></a><a href="#services" data-t="nServ"></a><a href="#gallery" data-t="nGal"></a><a href="#contact" data-t="nCon"></a></div>
  <div class="links"><a id="fWa" target="_blank" rel="noopener">WhatsApp</a><a id="fEi" target="_blank" rel="noopener">Eitaa</a></div>
  <div data-t="rights"></div>
</div></footer>

<div id="lb" role="dialog"><div id="lbi"></div></div>

const $=s=>document.querySelector(s);
let lang="fa",slideI=0,timer;
try{lang=localStorage.getItem("zk-lang")||"fa"}catch(e){}

/* ===== Render everything for the current language ===== */
function render(){
 const t=T[lang],r=document.documentElement;
 r.lang=lang;r.dir=lang==="fa"?"rtl":"ltr";document.title=t.brand;
 $("#lang").textContent=lang==="fa"?"EN":"فا";
 document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
 document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t[e.dataset.tp]);
 $("#navl").innerHTML=t.nav.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("");
 $("#servG").innerHTML=t.services.map(s=>`<div class="card"><div class="ic">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join("");
 $("#gearG").innerHTML=t.gear.map(g=>`<div class="card brand"><h3>${g[0]}</h3><p>${g[1]}</p></div>`).join("");
 const cols=[["#3a2408","#f39a1c"],["#1b1d24","#ffb84d"],["#5a3407","#16181f"],["#f39a1c","#2a1604"],["#2a2d38","#f39a1c"],["#16181f","#ffb84d"]];
 $("#galG").innerHTML=t.gal.map((g,i)=>`<button data-i="${i}" style="background:linear-gradient(135deg,${cols[i][0]},${cols[i][1]})">${g}</button>`).join("");
 $("#statG").innerHTML=t.stats.map(s=>`<div><b data-n="${s[0]}" data-s="${s[1]}">0${s[1]}</b><span>${s[2]}</span></div>`).join("");
 $("#track").innerHTML=t.reviews.map(x=>`<div class="slide"><p>«${x[0]}»</p><small>${x[1]}</small></div>`).join("");
 $("#dots").innerHTML=t.reviews.map((_,i)=>`<button data-d="${i}" aria-label="${i+1}"></button>`).join("");
 $("#faqG").innerHTML=t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
 slide(0);counters();
 /* contact links */
 $("#lCall").href="tel:"+CFG.phone;$("#lWa").href="https://wa.me/"+CFG.wa;$("#lEi").href="https://eitaa.com/"+CFG.eitaa;
 $("#fWa").href=$("#lWa").href;$("#fEi").href=$("#lEi").href;
}
$("#lang").onclick=()=>{lang=lang==="fa"?"en":"fa";try{localStorage.setItem("zk-lang",lang)}catch(e){}render()};
$("#burger").onclick=()=>$("#menu").classList.toggle("open");
$("#menu").onclick=e=>{if(e.target.tagName==="A")$("#menu").classList.remove("open")};

/* ===== Equalizer bars ===== */
$("#eq").innerHTML=Array.from({length:36},(_,i)=>`<b style="animation-delay:${(i*0.07).toFixed(2)}s;animation-duration:${(0.7+Math.random()*0.9).toFixed(2)}s"></b>`).join("");

/* ===== Slider ===== */
function slide(i){const n=T[lang].reviews.length;slideI=(i+n)%n;
 $("#track").style.transform=`translateX(${(lang==="fa"?1:-1)*slideI*100}%)`;
 document.querySelectorAll("#dots button").forEach((b,k)=>b.classList.toggle("on",k===slideI))}
$("#dots").onclick=e=>{if(e.target.dataset.d)slide(+e.target.dataset.d)};
clearInterval(timer);timer=setInterval(()=>slide(slideI+1),5000);

/* ===== Gallery lightbox ===== */
$("#galG").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 $("#lbi").style.background=b.style.background;$("#lbi").textContent=b.textContent;$("#lb").classList.add("on")};
$("#lb").onclick=()=>$("#lb").classList.remove("on");

/* ===== Animated counters + scroll reveal ===== */
function counters(){document.querySelectorAll("[data-n]").forEach(el=>{el.dataset.done=""})}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");
 e.target.querySelectorAll("[data-n]").forEach(el=>{if(el.dataset.done)return;el.dataset.done=1;
  const to=+el.dataset.n,s=el.dataset.s;let c=0;const st=Math.max(1,Math.ceil(to/60));
  const k=setInterval(()=>{c=Math.min(to,c+st);el.textContent=c+s;if(c>=to)clearInterval(k)},25)})}),{threshold:.15});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));

/* ===== Contact form -> WhatsApp / Eitaa ===== */
function msg(){const t=T[lang];
 return [t.msgHead,`${t.lN}: ${$("#n").value}`,`${t.lH}: ${$("#h").value}`,`${t.lD}: ${$("#d").value}`,`${t.lP}: ${$("#p").value}`,`${t.lM}: ${$("#m").value}`].join("\n")}
$("#sendWa").onclick=()=>{const t=T[lang];if(!$("#n").value.trim()){$("#note").textContent=t.needName;return}
 $("#note").textContent=t.noteWa;window.open("https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(msg()),"_blank")};
$("#sendEi").onclick=()=>{const t=T[lang];if(!$("#n").value.trim()){$("#note").textContent=t.needName;return}
 try{navigator.clipboard.writeText(msg())}catch(e){}
 $("#note").textContent=t.noteEi;window.open("https://eitaa.com/"+CFG.eitaa,"_blank")};

render();
document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);
</script>
